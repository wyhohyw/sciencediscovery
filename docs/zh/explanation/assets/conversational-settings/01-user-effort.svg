<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="936" viewBox="0 0 1040 936" role="img" aria-label="图 1：用户承担的配置工作，从自行处理到确认具体变更"><title>图 1：用户承担的配置工作，从自行处理到确认具体变更</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="936" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">把用户的配置负担，收敛为一次明确确认</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">同一场景：模型可用，PubMed 已安装且就绪，仅当前会话尚未启用。</tspan></text><rect x="32" y="100" width="976" height="78" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="135" font-size="23" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">共同起点：用户提出“用 PubMed 查几篇文献”</tspan></text><text x="54" y="217" font-size="24" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">原来 · 配置工作由用户承担</tspan></text><text x="554" y="217" font-size="24" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">现在 · 用户只需决定是否启用</tspan></text><text x="54" y="247" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">离开研究对话，进入设置流程</tspan></text><text x="554" y="247" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">留在当前对话，系统承接其余工作</tspan></text><rect x="32" y="270" width="476" height="88" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="54" y="305" font-size="21" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">用户找入口</tspan></text><text x="54" y="336" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">到哪里开启 PubMed？</tspan></text><polyline points="270,358 270,375" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="377" width="476" height="88" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="54" y="412" font-size="21" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">用户认字段、判断范围</tspan></text><text x="54" y="443" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">改哪一项？会不会影响其他会话？</tspan></text><polyline points="270,465 270,482" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="484" width="476" height="88" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="54" y="519" font-size="21" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">用户修改并保存</tspan></text><text x="54" y="550" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">自己完成启用操作，确认设置生效</tspan></text><polyline points="270,572 270,589" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="591" width="476" height="88" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="54" y="626" font-size="21" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">用户返回对话继续任务</tspan></text><text x="54" y="657" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">切回研究上下文，接着完成检索</tspan></text><rect x="532" y="270" width="476" height="104" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="305" font-size="20" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="554" dy="0">系统自动准备</tspan></text><text x="554" y="336" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">定位缺项、准备变更，展示原因和范围</tspan></text><polyline points="770,374 770,404" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="532" y="408" width="476" height="156" rx="16" fill="#246c49"/><text x="556" y="444" font-size="18" font-weight="600" fill="#d9efdf" text-anchor="start"><tspan x="556" dy="0">唯一需要用户操作的配置环节</tspan></text><text x="770" y="495" font-size="34" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="770" dy="0">确认本次启用</tspan></text><text x="770" y="534" font-size="20" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="770" dy="0">范围清楚：仅当前会话</tspan></text><polyline points="770,564 770,594" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="532" y="598" width="476" height="81" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="633" font-size="20" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="554" dy="0">系统写入并接回原任务</tspan></text><text x="554" y="664" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">提供新增工具，继续未完成的研究</tspan></text><polyline points="270,679 270,706 520,706 520,728" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,679 770,706 520,706" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="732" width="976" height="72" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6"/><text x="54" y="767" font-size="23" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="54" dy="0">共同终点：PubMed 在本次会话生效，研究任务继续</tspan></text><text x="36" y="846" font-size="20" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="36" dy="0">收益：不用找入口、不用辨认字段、不用离开对话；配置控制权仍在用户手中。</tspan></text><text x="36" y="882" font-size="17" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">此处比较用户承担的工作，不是固定点击数或耗时统计。</tspan><tspan x="36" dy="26">“一次确认”限于上述就绪场景；需要凭据时仍须补充信息，工具调用权限另行审批。</tspan></text></g></svg>
