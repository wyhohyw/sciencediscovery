<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-label="图 1：配置前后的用户操作对比"><title>图 1：配置前后的用户操作对比</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="610" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">把配置工作带回研究对话</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">体验对比示意：减少用户找入口、理解字段和重述任务的负担。</tspan></text><rect x="32" y="102" width="476" height="58" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="137" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">原来：用户自己找设置</tspan></text><rect x="532" y="102" width="476" height="58" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6"/><text x="554" y="137" font-size="21" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">目标体验：对话内完成必要配置</tspan></text><rect x="32" y="180" width="476" height="88" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="215" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">① 研究任务遇到缺口</tspan></text><text x="54" y="246" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">例如当前会话还不能用 PubMed</tspan></text><rect x="532" y="180" width="476" height="88" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="554" y="215" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="554" dy="0">① 用户照常提出研究要求</tspan></text><text x="554" y="246" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">已有配置够用，就直接执行</tspan></text><polyline points="270,268 270,283" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,268 770,283" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="285" width="476" height="88" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="320" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">② 离开对话，寻找设置</tspan></text><text x="54" y="351" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">找对入口，判断应该修改哪个字段</tspan></text><rect x="532" y="285" width="476" height="88" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="554" y="320" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="554" dy="0">② Agent 带出一项具体变更</tspan></text><text x="554" y="351" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">说明原因、修改内容和使用范围</tspan></text><polyline points="270,373 270,388" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,373 770,388" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="390" width="476" height="88" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="425" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">③ 填写、保存、判断影响</tspan></text><text x="54" y="456" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">还要确认会不会影响其他会话</tspan></text><rect x="532" y="390" width="476" height="88" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="554" y="425" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="554" dy="0">③ 用户在卡片中确认</tspan></text><text x="554" y="456" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">只补缺项，不用自己寻找设置页</tspan></text><polyline points="270,478 270,493" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,478 770,493" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="495" width="476" height="88" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="530" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">④ 回来继续解释任务</tspan></text><text x="54" y="561" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">确认设置已生效，再尝试接着做</tspan></text><rect x="532" y="495" width="476" height="88" rx="14" fill="#edf6ef" stroke="#d4e1d8" stroke-width="1.6"/><text x="554" y="530" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="554" dy="0">④ 原任务从已保存进度继续</tspan></text><text x="554" y="561" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">保留决定记录，最终返回研究结果</tspan></text></g></svg>
