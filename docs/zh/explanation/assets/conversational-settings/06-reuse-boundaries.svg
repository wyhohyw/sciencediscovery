<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="974" viewBox="0 0 1040 974" role="img" aria-label="图 6：已有能力复用与本项目待实现的接入边界"><title>图 6：已有能力复用与本项目待实现的接入边界</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="974" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">复用已有能力，把自研集中在配置协调</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">目标接入架构：原生 PubMed 路径已验证；上游模块仍需按版本适配与验收。</tspan></text><rect x="32" y="116" width="976" height="84" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="151" font-size="23" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">复用本项目交互：Agent 提案 → 用户决定 → 可展开回执</tspan></text><text x="54" y="182" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">ModelConnectWizard / 连接器卡片 / ProcessRecord</tspan></text><polyline points="520,200 520,238" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="240" width="976" height="136" rx="14" fill="#fff6df" stroke="#bf9854" stroke-width="1.6"/><text x="54" y="275" font-size="25" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">本项目待补齐：统一配置协调</tspan></text><text x="54" y="306" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">能力与字段归一化 / 变更预览 / 范围和版本检查 / 配置决定</tspan><tspan x="54" dy="26">本地条件事务或外部操作回执；保存、激活、恢复分别记录。</tspan></text><polyline points="270,376 270,414" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,376 770,414" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="416" width="476" height="142" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="451" font-size="22" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">本项目现有领域服务</tspan></text><text x="54" y="482" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">模型向导 / 连接器目录 / 凭据存储</tspan><tspan x="54" dy="26">保留原有正式配置来源</tspan></text><rect x="532" y="416" width="476" height="142" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="451" font-size="21" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">WorkSwarm 领域控制面 · 待接入</tspan></text><text x="554" y="482" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">凭据 Schema / config / MCP 连接与重载</tspan><tspan x="554" dy="26">桥接版本、幂等回执与生效核对</tspan></text><polyline points="270,558 270,596" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,558 770,596" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="598" width="976" height="110" rx="14" fill="#fff6df" stroke="#bf9854" stroke-width="1.6"/><text x="54" y="633" font-size="24" font-weight="700" fill="#8a6324" text-anchor="start"><tspan x="54" dy="0">本项目待补齐：执行器恢复桥接</tspan></text><text x="54" y="664" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">绑定 request / run / Session / interrupt，协调 Stop 与等待状态</tspan><tspan x="54" dy="26">设置已保存 → 对目标任务生效 → 原 run 继续</tspan></text><polyline points="270,708 270,746" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,708 770,746" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="748" width="476" height="116" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="783" font-size="22" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">Native · 复用现有检查点</tspan></text><text x="54" y="814" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">当前 PubMed 同 run 路径已验证</tspan><tspan x="54" dy="26">公共端口提取及其他设置仍待完成</tspan></text><rect x="532" y="748" width="476" height="116" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="783" font-size="22" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">core / WorkSwarm · 待桥接</tspan></text><text x="554" y="814" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">复用 interrupt / resume / checkpointer</tspan><tspan x="554" dy="26">版本与集成验收通过后开放同 run</tspan></text><text x="36" y="905" font-size="19" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">正式设置只存一处；远端 RPC 在本地事务外处理。</tspan></text><text x="36" y="938" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">蓝：本项目已有　｜　绿虚线：上游已有、待适配　｜　橙：本项目待实现</tspan></text></g></svg>
