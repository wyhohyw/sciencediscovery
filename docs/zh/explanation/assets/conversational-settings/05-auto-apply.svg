<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-label="图 5：低风险自动应用的判断路径"><title>图 5：低风险自动应用的判断路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="744" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">30 秒自动应用：先授权，再等待取消机会</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">工具的 Always allow 不自动授予配置修改权。当前配置白名单只有 PubMed。</tspan></text><polygon points="300,125 535,188 300,251 65,188" fill="#edf6ef" stroke="#246c49" stroke-width="1.8"/><text x="300" y="183" font-size="21" font-weight="600" fill="#203a32" text-anchor="middle"><tspan x="300" dy="0">已开启独立的低风险</tspan><tspan x="300" dy="28">会话配置授权？</tspan></text><polyline points="300,251 300,294" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="320" y="280" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="320" dy="0">是</tspan></text></g><polygon points="300,295 535,358 300,421 65,358" fill="#edf6ef" stroke="#246c49" stroke-width="1.8"/><text x="300" y="353" font-size="21" font-weight="600" fill="#203a32" text-anchor="middle"><tspan x="300" dy="0">PubMed 在白名单，且</tspan><tspan x="300" dy="28">安装、就绪等条件满足？</tspan></text><polyline points="535,188 806,188 806,262" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="626" y="174" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="626" dy="0">否</tspan></text></g><polyline points="535,358 580,358 580,318 630,318" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="552" y="345" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="552" dy="0">否</tspan></text></g><rect x="632" y="264" width="350" height="108" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="654" y="299" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="654" dy="0">等待用户明确确认</tspan></text><text x="654" y="330" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="654" dy="0">不会因等待时间过去而批准</tspan></text><polyline points="300,421 300,464" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="320" y="450" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="320" dy="0">是</tspan></text></g><rect x="70" y="466" width="460" height="108" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="92" y="501" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="92" dy="0">30 秒缓冲，可取消</tspan></text><text x="92" y="532" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="92" dy="0">到期由服务端重新检查条件</tspan><tspan x="92" dy="26">不靠用户浏览器保持在线</tspan></text><polyline points="530,520 632,520" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="534" y="502" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="534" dy="0">发生变化</tspan></text></g><rect x="634" y="466" width="348" height="108" rx="14" fill="#f3f5f3" stroke="#d4e1d8" stroke-width="1.6"/><text x="656" y="501" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="656" dy="0">停止自动应用</tspan></text><text x="656" y="532" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="656" dy="0">取消、Stop、关闭授权</tspan><tspan x="656" dy="26">或设置/连接器条件已变化</tspan></text><polyline points="300,574 300,620" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="321" y="602" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="321" dy="0">条件仍满足</tspan></text></g><rect x="70" y="622" width="460" height="88" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6"/><text x="92" y="657" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="92" dy="0">应用配置，接回原任务</tspan></text><text x="92" y="688" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="92" dy="0">工具调用仍按自己的权限策略执行</tspan></text></g></svg>
