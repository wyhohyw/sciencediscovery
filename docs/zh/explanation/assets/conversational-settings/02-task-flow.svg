<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1010" viewBox="0 0 1040 1010" role="img" aria-label="图 2：从研究任务到配置确认和结果的主流程"><title>图 2：从研究任务到配置确认和结果的主流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="1010" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">一次 PubMed 任务，如何走到结果</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">前提：模型可用、PubMed 已安装；本图展示用户确认的主路径。</tspan></text><rect x="270" y="106" width="500" height="88" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="292" y="141" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="292" dy="0">用户：用 PubMed 查 3 篇文献</tspan></text><text x="292" y="172" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="292" dy="0">由主 Agent 完成，不委派子 Agent</tspan></text><polyline points="520,194 520,222" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="520,224 705,286 520,348 335,286" fill="#edf6ef" stroke="#246c49" stroke-width="1.8"/><text x="520" y="281" font-size="21" font-weight="600" fill="#203a32" text-anchor="middle"><tspan x="520" dy="0">PubMed 在当前</tspan><tspan x="520" dy="28">会话已启用？</tspan></text><polyline points="335,286 210,286 210,388" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="250" y="274" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="250" dy="0">是</tspan></text></g><polyline points="705,286 830,286 830,388" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g stroke="#fff" stroke-width="6" paint-order="stroke"><text x="750" y="274" font-size="18" font-weight="600" fill="#246c49" text-anchor="start"><tspan x="750" dy="0">否</tspan></text></g><rect x="40" y="390" width="340" height="106" rx="14" fill="#edf6ef" stroke="#d4e1d8" stroke-width="1.6"/><text x="62" y="425" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="62" dy="0">直接进入工具执行</tspan></text><text x="62" y="456" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="62" dy="0">无需重复配置确认</tspan></text><rect x="660" y="390" width="340" height="106" rx="14" fill="#fff6df" stroke="#e2ce9c" stroke-width="1.6"/><text x="682" y="425" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="682" dy="0">卡片说明本次变更</tspan></text><text x="682" y="456" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="682" dy="0">仅当前会话启用 PubMed</tspan><tspan x="682" dy="26">原任务保存进度后等待</tspan></text><polyline points="830,496 830,542" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="660" y="544" width="340" height="108" rx="14" fill="#edf6ef" stroke="#d4e1d8" stroke-width="1.6"/><text x="682" y="579" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="682" dy="0">用户确认，设置生效</tspan></text><text x="682" y="610" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="682" dy="0">回到同一次研究任务</tspan><tspan x="682" dy="26">不要求重新发送原问题</tspan></text><polyline points="210,496 210,720 520,720 520,752" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="830,652 830,720 520,720" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="754" width="550" height="108" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="267" y="789" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="267" dy="0">如果工具另需授权，再单独询问</tspan></text><text x="267" y="820" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="267" dy="0">配置已启用，不等于实际检索已获权限</tspan></text><polyline points="520,862 520,894" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="896" width="550" height="88" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6"/><text x="267" y="931" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="267" dy="0">调用 PubMed，给出文献和来源</tspan></text><text x="267" y="962" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="267" dy="0">只在研究结束时出现最终答复</tspan></text></g></svg>
