<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="732" viewBox="0 0 1040 732" role="img" aria-label="图 6：公共配置机制与领域适配器分工"><title>图 6：公共配置机制与领域适配器分工</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="732" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">公共流程复用，领域规则分别实现</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#8a6324" text-anchor="start"><tspan x="36" dy="0">目标架构示意：通用公共层尚未完整提取，不能视为全部设置已经接入。</tspan></text><rect x="48" y="110" width="440" height="88" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="70" y="145" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="70" dy="0">Agent：说明任务需要什么</tspan></text><text x="70" y="176" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="70" dy="0">只能检查和提案，不能批准自己的变更</tspan></text><rect x="552" y="110" width="440" height="88" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="574" y="145" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="574" dy="0">用户：补缺项并决定</tspan></text><text x="574" y="176" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="574" dy="0">确认具体变更、验证动作与影响范围</tspan></text><polyline points="268,198 268,238" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="772,198 772,238" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="240" width="944" height="170" rx="14" fill="#fff6df" stroke="#bf9854" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="275" font-size="25" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="70" dy="0">目标公共配置服务</tspan></text><text x="70" y="306" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="70" dy="0">共用：卡片与输入描述 → 变更预览 → 用户决定 → 验证与保存</tspan><tspan x="70" dy="26">共用：结果记录、重复操作处理，以及新配置生效和任务恢复协调</tspan><tspan x="70" dy="26">正式设置仍写入原来的领域存储，不另存一套配置值。</tspan></text><polyline points="194,410 194,452" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="454" width="292" height="114" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="70" y="489" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="70" dy="0">模型适配器</tspan></text><text x="70" y="520" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="70" dy="0">协议、地址、凭据</tspan><tspan x="70" dy="26">模型发现、验证与绑定</tspan></text><polyline points="194,568 194,606" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="520,410 520,452" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="374" y="454" width="292" height="114" rx="14" fill="#edf6ef" stroke="#d4e1d8" stroke-width="1.6"/><text x="396" y="489" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="396" dy="0">连接器适配器</tspan></text><text x="396" y="520" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="396" dy="0">已安装与就绪检查</tspan><tspan x="396" dy="26">会话启用与工具重建</tspan></text><polyline points="520,568 520,606" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="846,410 846,452" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="700" y="454" width="292" height="114" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="722" y="489" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="722" dy="0">其他设置适配器</tspan></text><text x="722" y="520" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="722" dy="0">例如超时、代理、Runner</tspan><tspan x="722" dy="26">按类型接入，尚待实现</tspan></text><polyline points="846,568 846,606" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="608" width="944" height="90" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6"/><text x="70" y="643" font-size="23" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="70" dy="0">复用已有设置、模型和凭据存储</tspan></text><text x="70" y="674" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="70" dy="0">每个适配器负责领域校验与影响范围，公共流程负责统一组织。</tspan></text></g></svg>
