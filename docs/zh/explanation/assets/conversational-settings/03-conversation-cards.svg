<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="568" viewBox="0 0 1040 568" role="img" aria-label="图 3：配置卡、折叠回执和研究结果示意"><title>图 3：配置卡、折叠回执和研究结果示意</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="568" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="42" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="30" dy="0">用户会看到的三个时刻</tspan></text><text x="30" y="74" font-size="17" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="30" dy="0">卡片示意，非实际截图。第二张权限卡是否出现取决于工具权限策略。</tspan></text><rect x="24" y="100" width="304" height="446" rx="16" fill="#f3f5f3" stroke="#d4e1d8"/><rect x="368" y="100" width="304" height="446" rx="16" fill="#f3f5f3" stroke="#d4e1d8"/><rect x="712" y="100" width="304" height="446" rx="16" fill="#f3f5f3" stroke="#d4e1d8"/><text x="44" y="138" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="44" dy="0">01 · 等待配置</tspan></text><rect x="40" y="160" width="272" height="72" rx="14" fill="#edf4fa" stroke="#d4e1d8" stroke-width="1.6"/><text x="62" y="195" font-size="18" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="62" dy="0">用 PubMed 查 3 篇文献</tspan></text><rect x="40" y="248" width="272" height="218" rx="14" fill="#fff" stroke="#246c49" stroke-width="1.6"/><text x="62" y="283" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="62" dy="0">启用 PubMed</tspan></text><text x="62" y="314" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="62" dy="0">已安装，当前会话未启用</tspan><tspan x="62" dy="26">变更：加入可用连接器</tspan><tspan x="62" dy="26">范围：仅当前会话</tspan></text><rect x="56" y="404" width="240" height="42" rx="7" fill="#246c49"/><text x="176" y="432" font-size="18" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="176" dy="0">确认启用并继续</tspan></text><text x="44" y="507" font-size="17" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="44" dy="0">任务状态：等待配置</tspan><tspan x="44" dy="23">此时没有最终研究答复</tspan></text><text x="388" y="138" font-size="20" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="388" dy="0">02 · 已处理，原任务继续</tspan></text><rect x="384" y="160" width="272" height="72" rx="9" fill="#edf6ef" stroke="#d4e1d8"/><path d="M398 187 l8 6 -8 6" fill="none" stroke="#246c49" stroke-width="2"/><text x="420" y="190" font-size="17" font-weight="400" fill="#246c49" text-anchor="start"><tspan x="420" dy="0">PubMed 已启用</tspan><tspan x="420" dy="23">仅当前会话 · 可展开详情</tspan></text><rect x="384" y="248" width="272" height="218" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="406" y="283" font-size="19" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="406" dy="0">允许这次文献检索？</tspan></text><text x="406" y="314" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="406" dy="0">这是工具执行权限</tspan><tspan x="406" dy="26">与启用配置分别决定</tspan><tspan x="406" dy="26">按原权限策略处理</tspan></text><rect x="400" y="404" width="240" height="42" rx="7" fill="#275e86"/><text x="520" y="432" font-size="18" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="520" dy="0">允许本次检索</tspan></text><text x="388" y="507" font-size="17" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="388" dy="0">任务状态：已恢复</tspan><tspan x="388" dy="23">或等待独立工具权限</tspan></text><text x="732" y="138" font-size="22" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="732" dy="0">03 · 返回研究结果</tspan></text><rect x="728" y="160" width="272" height="306" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="750" y="195" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="750" dy="0">检索完成</tspan></text><text x="750" y="226" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="750" dy="0">文献 1：标题、年份、来源</tspan><tspan x="750" dy="26"></tspan><tspan x="750" dy="26">文献 2：标题、年份、来源</tspan><tspan x="750" dy="26"></tspan><tspan x="750" dy="26">文献 3：标题、年份、来源</tspan><tspan x="750" dy="26"></tspan><tspan x="750" dy="26">再概括共同研究方向</tspan></text><text x="732" y="507" font-size="17" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="732" dy="0">配置记录仍可回看</tspan><tspan x="732" dy="23">最终答复在任务结束后出现</tspan></text></g></svg>
