<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="974" viewBox="0 0 1040 974" role="img" aria-label="图 6：本轮已接入的公共层与待接通的上游宿主"><title>图 6：本轮已接入的公共层与待接通的上游宿主</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="974" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">复用已有能力，把自研集中在配置协调</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">当前接入边界：本地通用层与 Native 已接入；上游实际宿主仍受能力门控。</tspan></text><rect x="32" y="116" width="976" height="84" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="151" font-size="23" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">复用本项目交互：Agent 提案 → 用户决定 → 可展开回执</tspan></text><text x="54" y="182" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">旧向导与专用卡片保留；通用 schema 卡片 / ProcessRecord</tspan></text><polyline points="520,200 520,238" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="240" width="976" height="136" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="275" font-size="25" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">已实现：统一配置服务与四类适配器</tspan></text><text x="54" y="306" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">能力与字段归一化 / 变更预览 / 范围和版本检查 / 配置决定</tspan><tspan x="54" dy="26">本地事务、revision、receipt、outbox；远端 worker 已有合同，实际后端待接通。</tspan></text><polyline points="270,376 270,414" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,376 770,414" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="416" width="476" height="142" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="451" font-size="22" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">本项目现有领域服务</tspan></text><text x="54" y="482" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">模型向导 / 连接器目录 / 凭据存储</tspan><tspan x="54" dy="26">保留原有正式配置来源</tspan></text><rect x="532" y="416" width="476" height="142" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="451" font-size="21" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">WorkSwarm 领域控制面 · 待接入</tspan></text><text x="554" y="482" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">凭据 Schema / config / MCP 连接与重载</tspan><tspan x="554" dy="26">桥接版本、幂等回执与生效核对</tspan></text><polyline points="270,558 270,596" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,558 770,596" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="598" width="976" height="110" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="633" font-size="24" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">按执行器接入：Native 已贯通，JiuwenSwarm 仍需实际宿主</tspan></text><text x="54" y="664" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">Native 复用原检查点与队列；JiuwenSwarm 保留精确 interrupt 绑定合同</tspan><tspan x="54" dy="26">设置已保存 → 对目标任务生效 → 原 run 继续</tspan></text><polyline points="270,708 270,746" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,708 770,746" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="748" width="476" height="116" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="783" font-size="22" font-weight="700" fill="#275e86" text-anchor="start"><tspan x="54" dy="0">Native · 复用现有检查点</tspan></text><text x="54" y="814" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">持久 phase / outbox、准备工具目录</tspan><tspan x="54" dy="26">恢复前核对实际可执行工具指纹</tspan></text><rect x="532" y="748" width="476" height="116" rx="14" fill="#edf6ef" stroke="#246c49" stroke-width="1.6" stroke-dasharray="7 5"/><text x="554" y="783" font-size="22" font-weight="700" fill="#246c49" text-anchor="start"><tspan x="554" dy="0">core / WorkSwarm · 待桥接</tspan></text><text x="554" y="814" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">复用 interrupt / resume / checkpointer</tspan><tspan x="554" dy="26">core 补丁待集成，宿主桥接待开发</tspan></text><text x="36" y="905" font-size="19" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">正式设置只存一处；远端 RPC 在本地事务外处理。</tspan></text><text x="36" y="938" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">蓝：本项目已接入　｜　绿虚线：复用上游基础，宿主增强待开发</tspan></text></g></svg>
