<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="608" viewBox="0 0 1040 608" role="img" aria-label="图 4：同一任务暂停和恢复的时间线"><title>图 4：同一任务暂停和恢复的时间线</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246c49"/></marker></defs><rect width="1040" height="608" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="36" dy="0">暂停的是执行，保留的是同一次任务</tspan></text><text x="36" y="76" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="36" dy="0">当前已实现范围：原生执行器的已安装连接器启用流程。</tspan></text><rect x="32" y="108" width="976" height="70" rx="14" fill="#edf6ef" stroke="#246c49"/><text x="520" y="152" font-size="25" font-weight="700" fill="#246c49" text-anchor="middle"><tspan x="520" dy="0">同一个任务编号，例如 R-101（示意编号）</tspan></text><rect x="32" y="228" width="226" height="194" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="54" y="263" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">已完成的工作</tspan></text><text x="54" y="294" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">接收研究目标</tspan><tspan x="54" dy="26">完成已发出的工具步骤</tspan><tspan x="54" dy="26">保存已提交结果</tspan></text><polyline points="258,325 280,325" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="282" y="228" width="226" height="194" rx="14" fill="#fff6df" stroke="#d4e1d8" stroke-width="1.6"/><text x="304" y="263" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="304" dy="0">等待配置决定</tspan></text><text x="304" y="294" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="304" dy="0">写入恢复记录</tspan><tspan x="304" dy="26">向用户展示配置卡</tspan><tspan x="304" dy="26">不输出最终答复</tspan></text><polyline points="508,325 530,325" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="532" y="228" width="226" height="194" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="554" y="263" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="554" dy="0">配置确认生效</tspan></text><text x="554" y="294" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="554" dy="0">只加入获准连接器</tspan><tspan x="554" dy="26">保留原问题与任务编号</tspan><tspan x="554" dy="26">重新提供可用工具</tspan></text><polyline points="758,325 780,325" fill="none" stroke="#246c49" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="782" y="228" width="226" height="194" rx="14" fill="#fff" stroke="#d4e1d8" stroke-width="1.6"/><text x="804" y="263" font-size="21" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="804" dy="0">继续未完成工作</tspan></text><text x="804" y="294" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="804" dy="0">读回已保存进度</tspan><tspan x="804" dy="26">不重做已提交步骤</tspan><tspan x="804" dy="26">检索后返回最终结果</tspan></text><rect x="32" y="464" width="976" height="112" rx="14" fill="#edf4fa" stroke="#b9cfdf" stroke-width="1.6"/><text x="54" y="499" font-size="23" font-weight="700" fill="#203a32" text-anchor="start"><tspan x="54" dy="0">“检查点”就是恢复所需的任务记录</tspan></text><text x="54" y="530" font-size="18" font-weight="400" fill="#586d64" text-anchor="start"><tspan x="54" dy="0">记录目标、已提交结果与恢复位置；不是恢复任意程序内存，也不判断未知外部动作是否成功。</tspan><tspan x="54" dy="26">最终助手答复只在原研究任务真正结束后生成。</tspan></text></g></svg>
