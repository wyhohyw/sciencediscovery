name: PR 770 real Neo4j UI evidence
on:
  push:
    branches: [evidence/pr770-memory-real-595ea493]
permissions:
  contents: read
concurrency:
  group: pr770-memory-real-evidence
  cancel-in-progress: false
jobs:
  screenshots:
    if: github.repository == 'wyhohyw/sciencediscovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read isolated evidence harness
        uses: actions/checkout@v4
        with:
          path: evidence-harness
          persist-credentials: false
      - name: Read exact unmodified product
        uses: actions/checkout@v4
        with:
          repository: wyhohyw/sciencediscovery
          ref: 595ea493ab62dda8372f3257fb54fc5f2f1b738d
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable target and install locked dependencies
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = 595ea493ab62dda8372f3257fb54fc5f2f1b738d
          test "$(git rev-parse HEAD^{tree})" = 3aa1eea1da91fa30ef1e703285d2e3463b5feedb
          npm install --global pnpm@11.1.2
          pnpm install --frozen-lockfile
          pnpm build
          node test/sync-e2e.mjs --write
          npm ci --prefix .e2e
          node test/sync-e2e.mjs --check
          .e2e/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m venv .tmp/memory-venv
          .tmp/memory-venv/bin/python -m pip install ./services/memory-graph
          docker pull neo4j:5.26-community
      - name: Capture actual product with real MemoryGraph and Neo4j Community
        working-directory: product
        env:
          EVIDENCE_PYTHON: ${{ github.workspace }}/product/.tmp/memory-venv/bin/python
        run: |
          mkdir -p .tmp
          cp ../evidence-harness/evidence/capture.mjs .tmp/pr770-capture.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          node .tmp/pr770-capture.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain only screenshots and non-secret result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr770-memory-real-595ea493
          path: product/.tmp/pr770-real-evidence-output/
          if-no-files-found: warn
          retention-days: 7
